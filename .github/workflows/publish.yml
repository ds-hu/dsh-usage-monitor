# 把 fork-vX.Y.Z 标签发布到 npm。
#
# 认证走 OIDC 可信发布：npm CLI 用工作流的 id-token 换一枚短时发布令牌，仓库里
# 不存任何 npm token。信任关系只能由人来建（要 2FA 批准），一次就好：
#
#   npm login
#   npm trust github @ds-hu/dsh-token-quota \
#     --file publish.yml \
#     --repo ds-hu/dsh-usage-monitor --allow-publish
#
# `--file` 只收文件名：写成 .github/workflows/publish.yml 会被
# "GitHub Actions workflow must be just a file not a path" 拒掉。
# package.json 里的 repository 还指着上游，这条命令会警告仓库不一致——预期如此，继续即可。
#
# 这条配置若 48 小时内没有一次成功发布就会过期失效，所以建好后要当场打标签；
# `npm trust list @ds-hu/dsh-token-quota` 看当前生效的关系。
# 只有 push、release、workflow_dispatch 换得到可信发布令牌，pull_request_target
# 与 issue_comment 会被 registry 拒绝。
#
# 标签带 fork- 前缀（见 docs/releasing.md），历史 vX.Y.Z 标签不会触发本工作流。

name: publish

on:
  push:
    tags: ['fork-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install a CLI that speaks trusted publishing
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          npm test
          npm run test:pack
      # 标签与 manifest 必须指同一个版本，否则一个手滑的 fork-v 前缀就会把
      # 上一版号重新发一遍（registry 以 2.4.0 已存在为由拒绝，但报错会绕远路）。
      - name: Refuse a tag that disagrees with the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#fork-v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      # OIDC 发布会自动附上 provenance 证明，不需要额外的 --provenance。
      - name: Publish
        run: npm publish --access public
